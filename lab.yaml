name: yande.re 动漫图 · 实验版
description: 【测试版】洗牌袋 + 按月切块 + 两源轮换，目标是把重复率压到 10% 左右；功能与正式版一致，只是换图策略不同
author: Cuttlefish
icon: https://raw.githubusercontent.com/a13609y/yandere-widget-lab/main/icon.png
homepage: https://github.com/a13609y/yandere-widget-lab
manual: https://github.com/a13609y/yandere-widget-lab#readme

# 设置项顺序：换图间隔 → 洗牌 → 分级 → 内容 → 画幅 → 过滤 → 显示
env_schema:
  # ── 换图间隔（最常调，放最上面）──
  COOLDOWN:
    name: 换图间隔（分钟）
    description: "分钟。填 0 = 每次刷新都实时请求新图（想看新图就手动填 0）；>0 = 间隔内直接显示上次那张，不联网。不填时的默认值是 30"
    default_value: "30"

  # ── 洗牌袋（测试版核心）──
  BAG_SIZE:
    name: 洗牌 · 每袋张数
    description: "一次向源站要多少张的清单（只取元数据，不下载图片）。一袋之内绝不重复，发完才换下一袋。50 = 每 50 次刷新换一袋"
    options: ["20", "30", "50", "80", "100"]
    default_value: "50"

  MONTH_SLICE:
    name: 洗牌 · 按月切块
    description: "开 = 每次装袋随机挑一个自然月（例如 2024-03），只在这个月里取图。好处是画风/时间分布均匀，不会老是最近那批；「最新」排序会自动忽略此项"
    options: ["true", "false"]
    default_value: "true"

  ARTIST_DEDUPE:
    name: 洗牌 · 画师去重
    description: "开 = 一袋里同一个画师最多 1 张。专治“批量投稿大户”：实测某个月 20 条随机帖里 15 条是同一个画师。关掉的话一袋能装更多，但可能连着看到同一个人的一堆图"
    options: ["true", "false"]
    default_value: "true"

  VARIANT_DEDUPE:
    name: 洗牌 · 变体去重
    description: "开 = 跳过同一张画的变体（父子图：草稿/完成版/不同裁切）以及同一 pixiv 作品的多张图。和「画师去重」互不影响，可以单独关掉对比"
    options: ["true", "false"]
    default_value: "true"

  REPEAT_PCT:
    name: 洗牌 · 允许重复比例
    description: "每次刷新有多大概率「回放」一张最久没出现过的旧图。0 = 永不重复（素材见底后可能取不到图），10 = 十次里大约一次旧图，均匀撒开不会连着撞同一张"
    options: ["0", "10", "20", "30", "40"]
    default_value: "10"

  # ── 分级（s / q / e 三个独立开关，至少留一个）──
  SHOW_S:
    name: 分级 · 全年龄（s）
    description: "三个开关自由组合；全关掉会自动按「仅全年龄」处理，不会筛空"
    options: ["true", "false"]
    default_value: "true"

  SHOW_Q:
    name: 分级 · 擦边（q）
    description: "打开后 Konachan 会自动切到 konachan.com（.net 镜像没有 q 级内容）"
    options: ["true", "false"]
    default_value: "true"

  SHOW_E:
    name: 分级 · 工口（e）
    description: "素材最少，单开时可能要多翻几页。同样会切到 konachan.com"
    options: ["true", "false"]

    default_value: "false"

  # ── 内容 ──
  TAGS:
    name: 内容 · 标签
    description: "yande.re 只有标签、没有全文搜索；多个标签是「同时满足」，用空格或逗号分隔（blue_sky clouds）。留空 = 随机。中文也行：初音 → hatsune_miku。常见标签：landscape、sky、clouds、hatsune_miku"
    default_value: ""

  SITE:
    name: 内容 · 图源
    description: "自动 = 先查 Konachan（一次给 100 条、素材多），没结果再试 yande.re。Konachan 会按分级自动换域名：只勾「全年龄」走 konachan.net（纯净镜像），勾了「擦边/工口」自动走 konachan.com（实测 .net 完全不返回 q/e）"
    options: ["自动", "yande.re", "Konachan"]

    default_value: "自动"

  SORT:
    name: 内容 · 排序
    description: "随机 = 每次抽一批新的（推荐）；热度 = 全站评分降序（会偏老图）；最新 = 发布时间倒序"
    options: ["随机", "热度", "最新"]

    default_value: "随机"

  PERIOD:
    name: 内容 · 时段
    description: "只取最近这段时间发布的图。配合「随机/热度」用；选「最新」时自动忽略。时段越短素材越少，评分上限也越低（一年内最高约 190 分，一周内普遍只有 40~60 分）。默认「三年内」：素材够多、不会翻到十几年前的老图"
    options: ["不限", "一天内", "一周内", "一个月内", "三个月内", "半年内", "一年内", "两年内", "三年内", "六年内"]
    default_value: "三年内"

  # ── 画幅 ──
  RATIO_CUSTOM:
    name: 画幅 · 自定义容忍
    description: "关 = 粗分档（≥1.35 横 / 0.75~1.35 方 / <0.75 竖）；开 = 按理想比例 ±容忍百分比（横 1.78 / 方 1.33 / 竖 0.71），默认开。画幅选「不限」时此项不生效"
    options: ["true", "false"]
    default_value: "true"

  RATIO_TOL:
    name: 画幅 · 容忍百分比
    description: "仅在上面开关打开时生效，单位 %，可填 5~50；留空按 10。基准比例按 booru 实际分布取：横 1.78 / 方 1.33（4:3，不是 1:1）/ 竖 0.71。例：10 时横图收 1.60~1.96、方图收 1.20~1.46、竖图收 0.64~0.78"
    default_value: "10"

  RATIO_MODE:
    name: 画幅 · 尺寸适配
    description: "自动 = 小号方图 / 中号横图 / 大号方图 / 超大号横图（推荐）；也可以四个尺寸统一成方图、横图、竖图或不限。判定按实际宽高比：≥1.35 横、0.75~1.35 方、<0.75 竖"
    options: ["自动", "方图", "横图", "竖图", "不限"]
    default_value: "自动"

  # ── 过滤 ──
  MIN_W:
    name: 过滤 · 最小短边
    description: "图片短边低于这个值的直接跳过，防止拿到糊图"
    options: ["720", "1024", "1280", "1500"]

    default_value: "1024"

  EX_NIPPLE:
    name: 过滤 · 露点（nipples）
    description: "按 _ 分段匹配，erect_nipples / puffy_nipples 也会一起排掉 ｜ 站点：两站都有（`nipples`）；`nipple` 单数仅 yande.re"
    options: ["true", "false"]
    default_value: "false"

  EX_PANEL:
    name: 过滤 · 多格（4koma）
    description: "只排 4 格漫画 ｜ 站点：仅 yande.re｜默认开：多格图在小组件上基本看不清"
    options: ["true", "false"]
    default_value: "true"

  EX_WHITE:
    name: 过滤 · 白色（white）
    description: "只匹配整词 white，不会误伤 white_hair ｜ 站点：仅 Konachan｜默认开：白底/纯白画面在桌面组件上很脏"
    options: ["true", "false"]
    default_value: "true"

  EXCLUDE_EXTRA:
    name: 过滤 · 自定义标签
    description: "多个用逗号分隔（guro, vore）；标签内部的空格会自动转下划线（erect nipples → erect_nipples）"
    default_value: ""

  # ── 显示（其余）──
  SHOW_INFO:
    name: 显示 · 分辨率
    description: "左下角显示 分辨率 + 收藏数，默认关；想看再手动打开"
    options: ["true", "false"]
    default_value: "false"

  DEBUG:
    name: 显示 · 调试角标
    description: "一行状态：版本/图源/比例/画幅/分级/体积/排序/时段/异常标记"
    options: ["true", "false"]

    default_value: "false"

scriptings:
  - generic:
      name: YandereWidget
      script_url: https://raw.githubusercontent.com/a13609y/yandere-widget-lab/main/lab.js
      timeout: 60

widgets:
  - name: 动漫图
    script_name: YandereWidget
    env: {}
